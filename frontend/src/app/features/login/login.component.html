<div class="login-screen">
  <div class="login-card card">
    <div class="login-brand">
      <span class="glyph">🌾</span>
      <h1>Demeter</h1>
      <p>Gestión de la granja</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="enviar()">
      <div class="field">
        <label for="username">Usuario</label>
        <input id="username" type="text" formControlName="username" autocomplete="username" placeholder="ej. admin" />
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <input id="password" type="password" formControlName="password" autocomplete="current-password" placeholder="••••••••" />
      </div>

      @if (error()) {
        <p class="login-error">{{ error() }}</p>
      }

      <button type="submit" class="btn btn-primary login-submit" [disabled]="form.invalid || cargando()">
        @if (cargando()) {
          <span class="spinner"></span> Entrando…
        } @else {
          Iniciar sesión
        }
      </button>
    </form>
  </div>
</div>
