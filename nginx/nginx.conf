# D:\proyectos\Demeter\nginx\nginx.conf
worker_processes 1;

events {
    worker_connections 1024;
}

http {
    # SSL (replace with your certs)
    server {
        listen 443 ssl;
        server_name demeter.example.com;

        ssl_certificate /etc/nginx/ssl/demeter.crt;
        ssl_certificate_key /etc/nginx/ssl/demeter.key;

        # Health check endpoint
        location /health {
            return 200 "OK";
        }

        # Proxy each micro‑service by path prefix
        location /alimentacion {
            proxy_pass http://host.docker.internal:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /corrales {
            proxy_pass http://host.docker.internal:8001;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /inventario {
            proxy_pass http://host.docker.internal:8003;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /iot {
            proxy_pass http://host.docker.internal:8004;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /usuarios {
            proxy_pass http://host.docker.internal:8005;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /alimentacion_ia {
            proxy_pass http://host.docker.internal:8002;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ia {
            proxy_pass http://host.docker.internal:8006;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ia_notificaciones {
            proxy_pass http://host.docker.internal:8007;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /clima_externo {
            proxy_pass http://host.docker.internal:8008;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /ordenes_trabajo {
            proxy_pass http://host.docker.internal:8009;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /notificaciones {
            proxy_pass http://host.docker.internal:8010;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Optional: serve API docs from each service at /docs
        location /alimentacion/docs {
            proxy_pass http://host.docker.internal:8000/docs;
        }
        location /corrales/docs {
            proxy_pass http://host.docker.internal:8001/docs;
        }
        location /inventario/docs {
            proxy_pass http://host.docker.internal:8003/docs;
        }
        location /iot/docs {
            proxy_pass http://host.docker.internal:8004/docs;
        }
        location /usuarios/docs {
            proxy_pass http://host.docker.internal:8005/docs;
        }
    }
}